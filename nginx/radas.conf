# RADAS router (nginx) — Phase 8 cutover: Phoenix is the primary (only)
# backend. The Flask server (apps/server) is retired; nothing routes to it.
# This front door stays so the console keeps a single origin.
#
# Local dev usage (macOS, nginx installed via brew):
#   cd <repo root> && nginx -c "$PWD/nginx/radas.conf" -p "$PWD"
#   nginx -c "$PWD/nginx/radas.conf" -p "$PWD" -s stop   # stop
#
# Health: curl -i http://localhost:8090/api/elixir/health

worker_processes 1;
error_log logs/nginx-router-error.log warn;
pid logs/nginx-router.pid;

events {
    worker_connections 256;
}

http {
    access_log logs/nginx-router-access.log;

    upstream phoenix_server {
        server 127.0.0.1:4000;
    }

    server {
        listen 8090;

        # ---- Migrated endpoints ------------------------------------------
        # Phase 1 (AI Router) — ACTIVE: the Phoenix server serves the full
        # /api/v1 gateway surface and /api/orgs/<org_id>/ai/* management.
        location /api/v1/ {
            proxy_pass http://phoenix_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # AI gateway streams SSE (chat completions) — buffering must stay
            # off or chunks arrive coalesced and clients time out.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/orgs/[^/]+/ai/ {
            proxy_pass http://phoenix_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Health probe for the router itself and the Phoenix bootstrap.
        location /api/elixir/ {
            proxy_pass http://phoenix_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else → Phoenix. SSE surfaces (execution/stack run log
        # streams) get buffering off; the global regex location below keeps
        # that orthogonal to the prefixes above.
        location ~ ^/api/(executions/[^/]+/log/stream|projects/[^/]+/executions/[^/]+/log/stream|cloud/stacks/[^/]+/runs/[^/]+/stream) {
            proxy_pass http://phoenix_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://phoenix_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
