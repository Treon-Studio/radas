# RADAS local router (nginx) — strangler-fig front door for the Elixir
# migration. Default route: everything goes to the Flask server. As endpoints
# migrate, uncomment/extend the phoenix location blocks below and reload.
#
# Local dev usage (macOS, nginx installed via brew):
#   cd <repo root> && nginx -c "$PWD/nginx/radas.conf" -p "$PWD"
#   nginx -c "$PWD/nginx/radas.conf" -p "$PWD" -s stop   # stop
#
# Routes everything to Flask until a phase cuts an endpoint over; health:
#   curl -i http://localhost:8090/api/elixir/health   # after Phase 1 unblock

worker_processes 1;
error_log logs/nginx-router-error.log warn;
pid logs/nginx-router.pid;

events {
    worker_connections 256;
}

http {
    access_log logs/nginx-router-access.log;

    upstream flask_server {
        server 127.0.0.1:5001;
    }

    upstream phoenix_server {
        server 127.0.0.1:4000;
    }

    server {
        listen 8090;

        # ---- Migrated endpoints ------------------------------------------
        # Phase 1 (AI Router) — ACTIVE: the Phoenix server serves the full
        # /api/v1 gateway surface and /api/orgs/<org_id>/ai/* management.
        location /api/v1/ {
            proxy_pass http://phoenix_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # AI gateway streams SSE (chat completions) — buffering must stay
            # off or chunks arrive coalesced and clients time out.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location ~ ^/api/orgs/[^/]+/ai/ {
            proxy_pass http://phoenix_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Health probe for the router itself and the Phoenix bootstrap.
        location /api/elixir/ {
            proxy_pass http://phoenix_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else → Flask.
        location / {
            proxy_pass http://flask_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # AI gateway streams SSE (chat completions) — buffering must stay
            # off or chunks arrive coalesced and clients time out.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
