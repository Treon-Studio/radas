# Docker variant of the RADAS router (http-context only: worker_processes /
# events / pid live in the image's main nginx.conf). Mounted into the
# opensible-router compose service (profile "router").

upstream phoenix_server {
    server opensible-phoenix:4000;
}

server {
    listen 80;

    location /api/elixir/ {
        proxy_pass http://phoenix_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else → Flask until a migration phase cuts it over.
    location / {
        proxy_pass http://phoenix_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
