name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy server+worker → VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |

            set -e
            cd /opt/radas
            git pull origin main

            # Read presence only: never print or export production secrets into
            # the GitHub Actions environment. Values are supplied by /opt/radas/.env
            # (ecosystem.config.cjs loads the file itself for the pm2 entries).
            test -r /opt/radas/.env || { echo '/opt/radas/.env is required'; exit 1; }
            required_env() {
              name="$1"
              value=$(grep -E "^${name}=" /opt/radas/.env | tail -n 1 | cut -d= -f2-)
              if [ -z "${value}" ]; then
                echo "${name} is required in /opt/radas/.env"
                exit 1
              fi
            }
            # Phoenix configuration is owned by /opt/radas/.env. Do not
            # rewrite production values during a deploy; fail if the explicit
            # Phoenix switch is present but disabled.
            if grep -q '^PHOENIX_ENABLED=' /opt/radas/.env && ! grep -q '^PHOENIX_ENABLED=true$' /opt/radas/.env; then
              echo 'PHOENIX_ENABLED=true is required in /opt/radas/.env'
              exit 1
            fi

            required_env DATABASE_URL
            required_env JWT_SECRET_KEY
            required_env INTERNAL_CALL_SECRET
            required_env GLOBAL_SECRETS_ENCRYPTION_KEY
            required_env WORKER_REGISTRATION_SECRET
            required_env VAULT_SERVER_SECRET
            required_env PREVIEW_WEBHOOK_SECRET

            # The IaC templates live in templates/opensible-iac (tracked); the
            # server resolves them at apps/server/IaC/<provider>. Stage the
            # tree there (rsync keeps removed template files from lingering).
            mkdir -p /opt/radas/apps/server/IaC
            rsync -a --delete /opt/radas/templates/opensible-iac/ /opt/radas/apps/server/IaC/

            # Compile the Phoenix app (idempotent; first deploy takes longer).
            cd /opt/radas/apps/server
            mix deps.get
            mix ecto.migrate
            mix compile

            cd /opt/radas
            pm2 delete radas-phoenix || true
            pm2 start ecosystem.config.cjs --only radas-phoenix --update-env
            pm2 describe radas-phoenix | grep -q 'status.*online' || { echo 'radas-phoenix is not online'; exit 1; }

            cd /opt/radas/apps/worker
            go mod tidy && go build -o /opt/radas/bin/radas-worker ./cmd/worker
            # Recreate the worker from ecosystem.config.cjs so every secret is
            # loaded from /opt/radas/.env rather than an inherited PM2 env.
            cd /opt/radas
            pm2 delete radas-worker || true
            pm2 start ecosystem.config.cjs --only radas-worker --update-env
            pm2 describe radas-worker | grep -q 'status.*online' || { echo 'radas-worker is not online'; exit 1; }

            # Phoenix serves liveness and dependency readiness on :4000.
            health_code=000
            ready_code=000
            for attempt in $(seq 1 24); do
              health_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 http://127.0.0.1:4000/api/healthz || true)
              ready_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 http://127.0.0.1:4000/api/readyz || true)
              if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then break; fi
              sleep 5
            done
            echo "liveness: $health_code readiness: $ready_code"
            if [ "$health_code" != "200" ] || [ "$ready_code" != "200" ]; then
              pm2 status || true
              pm2 logs radas-phoenix --nostream --lines 80 || true
              pm2 logs radas-worker --nostream --lines 80 || true
              exit 1
            fi

            # Keep the existing contract smoke required on every deployment.
            RADAS_SMOKE_BASE_URL="http://127.0.0.1:4000" bash scripts/post-cutover-smoke.sh
