name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy server+worker → VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ADMIN_RESET_PASSWORD
          script: |

            set -e
            cd /opt/radas
            git pull origin main
            cd apps/opensible-server
            .venv/bin/pip install -q -r requirements.txt
            test -n "$(grep -E '^DATABASE_URL=' /opt/radas/.env | cut -d= -f2-)" || { echo 'DATABASE_URL is required in /opt/radas/.env'; exit 1; }
            test -n "$(grep -E '^JWT_SECRET_KEY=' /opt/radas/.env | cut -d= -f2-)" || { echo 'JWT_SECRET_KEY is required in /opt/radas/.env'; exit 1; }
            test -n "$(grep -E '^INTERNAL_CALL_SECRET=' /opt/radas/.env | cut -d= -f2-)" || { echo 'INTERNAL_CALL_SECRET is required in /opt/radas/.env'; exit 1; }
            if [ -n "${ADMIN_RESET_PASSWORD:-}" ]; then
              set -a
              . /opt/radas/.env
              set +a
              .venv/bin/python scripts/update_admin_password.py "$ADMIN_RESET_PASSWORD"
            fi
            if grep -q '^FLASK_ENV=' /opt/radas/.env; then sed -i 's/^FLASK_ENV=.*/FLASK_ENV=production/' /opt/radas/.env; else echo 'FLASK_ENV=production' >> /opt/radas/.env; fi
            if grep -q '^FLASK_DEBUG=' /opt/radas/.env; then sed -i 's/^FLASK_DEBUG=.*/FLASK_DEBUG=0/' /opt/radas/.env; else echo 'FLASK_DEBUG=0' >> /opt/radas/.env; fi
            if grep -q '^CORS_ALLOWED_ORIGINS=' /opt/radas/.env; then sed -i 's#^CORS_ALLOWED_ORIGINS=.*#CORS_ALLOWED_ORIGINS=https://radas-console.pages.dev#' /opt/radas/.env; else echo 'CORS_ALLOWED_ORIGINS=https://radas-console.pages.dev' >> /opt/radas/.env; fi
            test -n "$(grep -E '^DATABASE_URL=' /opt/radas/.env | cut -d= -f2-)" || { echo 'DATABASE_URL is required in /opt/radas/.env'; exit 1; }
            test -n "$(grep -E '^JWT_SECRET_KEY=' /opt/radas/.env | cut -d= -f2-)" || { echo 'JWT_SECRET_KEY is required in /opt/radas/.env'; exit 1; }
            test -n "$(grep -E '^INTERNAL_CALL_SECRET=' /opt/radas/.env | cut -d= -f2-)" || { echo 'INTERNAL_CALL_SECRET is required in /opt/radas/.env'; exit 1; }
            if grep -q '^FLASK_ENV=' /opt/radas/.env; then sed -i 's/^FLASK_ENV=.*/FLASK_ENV=production/' /opt/radas/.env; else echo 'FLASK_ENV=production' >> /opt/radas/.env; fi
            if grep -q '^FLASK_DEBUG=' /opt/radas/.env; then sed -i 's/^FLASK_DEBUG=.*/FLASK_DEBUG=0/' /opt/radas/.env; else echo 'FLASK_DEBUG=0' >> /opt/radas/.env; fi
            if grep -q '^CORS_ALLOWED_ORIGINS=' /opt/radas/.env; then sed -i 's#^CORS_ALLOWED_ORIGINS=.*#CORS_ALLOWED_ORIGINS=https://radas-console.pages.dev#' /opt/radas/.env; else echo 'CORS_ALLOWED_ORIGINS=https://radas-console.pages.dev' >> /opt/radas/.env; fi
            cd /opt/radas
            pm2 delete radas-server || true
            pm2 start ecosystem.config.cjs --only radas-server --update-env
            cd /opt/radas/apps/opensible-worker
            go mod tidy && go build -o /opt/radas/bin/radas-worker ./cmd/worker
            pm2 restart radas-worker --update-env || true
            cd /opt/radas
            grep -q 'PORT=5001' .env || echo 'PORT=5001' >> .env
            health_code=000
            for attempt in $(seq 1 12); do
              health_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5001/api/health || true)
              if [ "$health_code" = "200" ]; then break; fi
              sleep 5
            done
            echo "health: $health_code"
            if [ "$health_code" != "200" ]; then
              pm2 logs radas-server --nostream --lines 80 || true
              exit 1
            fi
