name: Chrome Extension - Build & Test

on:
  pull_request:
    paths:
      - 'apps/chrome-ext/**'
      - '.github/workflows/chrome-ext-build.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/chrome-ext/**'
      - '.github/workflows/chrome-ext-build.yml'

jobs:
  build:
    name: Build Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Pull secrets from Infisical
        working-directory: apps/chrome-ext
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN_CHROME_EXT_DEV }}
        run: |
          if [ -n "$INFISICAL_TOKEN" ]; then
            echo "✓ Pulling secrets from Infisical (dev environment)"
            infisical export --token="$INFISICAL_TOKEN" --env=dev --format=dotenv > .env
          else
            echo "⚠️  INFISICAL_TOKEN not set, using .env.example as fallback"
            cp .env.example .env
            # Set dummy values for build to succeed
            sed -i 's/your_api_key_here/dummy_api_key/g' .env
            sed -i 's/your_project_id/dummy-project/g' .env
            sed -i 's/your_messaging_sender_id/123456789/g' .env
            sed -i 's/your_app_id/1:123456789:web:abc123/g' .env
            sed -i 's/your_measurement_id/G-XXXXXXXXXX/g' .env
          fi

      - name: Type check
        working-directory: apps/chrome-ext
        run: pnpm compile

      - name: Build Chrome extension
        working-directory: apps/chrome-ext
        run: pnpm build

      - name: Build Firefox extension
        working-directory: apps/chrome-ext
        run: pnpm build:firefox

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ github.sha }}
          path: apps/chrome-ext/.output/chrome-mv3
          retention-days: 7

      - name: Upload Firefox build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-${{ github.sha }}
          path: apps/chrome-ext/.output/firefox-mv3
          retention-days: 7

      - name: Build summary
        run: |
          echo "## 🎉 Build successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Chrome Extension" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Firefox Extension" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
