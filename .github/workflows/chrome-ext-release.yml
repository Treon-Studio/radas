name: Chrome Extension - Release

on:
  push:
    tags:
      - 'chrome-ext-v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  release:
    name: Build & Release Chrome Extension
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "env_name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "token_secret=INFISICAL_TOKEN_CHROME_EXT_${{ github.event.inputs.environment == 'production' && 'PROD' || 'STAGING' }}" >> $GITHUB_OUTPUT
          else
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "token_secret=INFISICAL_TOKEN_CHROME_EXT_PROD" >> $GITHUB_OUTPUT
          fi

      - name: Pull secrets from Infisical
        working-directory: apps/chrome-ext
        env:
          INFISICAL_TOKEN_PROD: ${{ secrets.INFISICAL_TOKEN_CHROME_EXT_PROD }}
          INFISICAL_TOKEN_STAGING: ${{ secrets.INFISICAL_TOKEN_CHROME_EXT_STAGING }}
        run: |
          ENV_NAME="${{ steps.env.outputs.env_name }}"
          if [ "$ENV_NAME" == "production" ]; then
            INFISICAL_TOKEN="$INFISICAL_TOKEN_PROD"
          else
            INFISICAL_TOKEN="$INFISICAL_TOKEN_STAGING"
          fi

          if [ -n "$INFISICAL_TOKEN" ]; then
            echo "✓ Pulling secrets from Infisical ($ENV_NAME environment)"
            infisical export --token="$INFISICAL_TOKEN" --env="$ENV_NAME" --format=dotenv > .env
          else
            echo "❌ INFISICAL_TOKEN not set for $ENV_NAME"
            exit 1
          fi

      - name: Type check
        working-directory: apps/chrome-ext
        run: pnpm compile

      - name: Build Chrome extension
        working-directory: apps/chrome-ext
        run: pnpm build

      - name: Build Firefox extension
        working-directory: apps/chrome-ext
        run: pnpm build:firefox

      - name: Create Chrome zip
        working-directory: apps/chrome-ext
        run: pnpm zip

      - name: Create Firefox zip
        working-directory: apps/chrome-ext
        run: pnpm zip:firefox

      - name: Get version from package.json
        id: version
        working-directory: apps/chrome-ext
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/chrome-ext/.output/*.zip
          body: |
            ## 🎉 Chrome Extension Release v${{ steps.version.outputs.version }}

            ### Downloads
            - **Chrome**: `chrome-mv3-${{ steps.version.outputs.version }}.zip`
            - **Firefox**: `firefox-mv3-${{ steps.version.outputs.version }}.zip`

            ### Installation
            1. Download the appropriate zip file
            2. Extract the contents
            3. Load unpacked extension in your browser

            **Chrome**: chrome://extensions (Enable Developer Mode)
            **Firefox**: about:debugging#/runtime/this-firefox

            ---
            Built with ❤️ by Radas Team
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.env.outputs.env_name }}-v${{ steps.version.outputs.version }}
          path: apps/chrome-ext/.output/*.zip
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 🚀 Release successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.env.outputs.env_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Chrome Extension ZIP" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Firefox Extension ZIP" >> $GITHUB_STEP_SUMMARY

