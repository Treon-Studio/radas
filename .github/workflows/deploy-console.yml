name: Deploy Console (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build console (API → prod domain)
        working-directory: apps/radas-console
        env:
          VITE_API_BASE: https://api-radas.treonstudio.com
        run: pnpm build

      # Deploy via wrangler jika CLOUDFLARE_API_TOKEN tersedia.
      # Jika belum, job selesai dengan catatan (Pages bisa di-deploy manual
      # atau via GitHub integration di dashboard).
      - name: Deploy → Cloudflare Pages (wrangler)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: apps/radas-console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name radas-console

      - name: Skip note (token belum diset)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN belum diset — lewati deploy Pages otomatis. Set secret untuk mengaktifkan."
