name: Deploy Console (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Console (API -> prod domain)
        working-directory: apps/radas-console
        env:
          VITE_API_BASE: https://api-radas.treonstudio.com
        run: pnpm build

      - name: Deploy -> Cloudflare Pages (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set — skipping Cloudflare Pages deployment."
            exit 0
          fi
          cd apps/radas-console
          npx wrangler pages deploy dist --project-name radas-console
