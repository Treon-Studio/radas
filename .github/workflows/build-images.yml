name: Build & Publish Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/worker/**'
      - 'apps/console/**'
      - 'templates/opensible-iac/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: phoenix
            context: .
            dockerfile: apps/server/Dockerfile
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
          - name: console
            context: apps/console
            dockerfile: apps/console/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Stage the context each Dockerfile expects.
      # - phoenix: apps/server/Dockerfile builds the Phoenix app FROM the app
      #   root (COPY mix.exs, config, lib, priv), so the context IS apps/server.
      # - worker: apps/worker/Dockerfile COPYs worker/ and IaC/ from the
      #   context root, so those two directories are staged.
      - name: Stage build context (phoenix)
        if: matrix.name == 'phoenix'
        run: |
          mkdir -p /tmp/ctx
          cp -r apps/server/. /tmp/ctx/
          rm -f /tmp/ctx/.dockerignore

      - name: Stage build context (worker)
        if: matrix.name == 'worker'
        run: |
          mkdir -p /tmp/ctx
          cp -r apps/worker /tmp/ctx/worker
          cp apps/worker/Dockerfile /tmp/ctx/Dockerfile
          # IaC tracked source; the worker image ships it for tofu runs.
          cp -r templates/opensible-iac /tmp/ctx/IaC
          rm -f /tmp/ctx/.dockerignore

      - name: Console context (self-contained)
        if: matrix.name == 'console'
        run: |
          rm -rf /tmp/ctx
          mkdir -p /tmp/ctx
          cp -r apps/console/* /tmp/ctx/
          rm -rf /tmp/ctx/node_modules /tmp/ctx/dist

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable tags)
        uses: docker/build-push-action@v6
        with:
          context: /tmp/ctx
          file: /tmp/ctx/Dockerfile
          push: true
          tags: |
            ghcr.io/treon-studio/radas-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/treon-studio/radas-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GH_PACKAGES_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
