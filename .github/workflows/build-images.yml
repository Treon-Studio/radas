name: Build & Publish Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/worker/**'
      - 'apps/console/**'
      - 'IaC/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: phoenix
            context: .
            dockerfile: apps/server/Dockerfile
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
          - name: console
            context: apps/console
            dockerfile: apps/console/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # The Dockerfiles expect a legacy layout (server/, worker/, IaC/ at the
      # context root). Stage that layout instead of rewriting the Dockerfiles.
      - name: Stage build context
        if: matrix.name != 'console'
        run: |
          mkdir -p /tmp/ctx
          if [ "${{ matrix.name }}" = "phoenix" ]; then
            # Phoenix replaced the legacy Flask app, but its Dockerfile
            # remains under apps/server for the public image name.
            cp -r apps/server /tmp/ctx/server
          else
            cp -r apps/${{ matrix.name }} /tmp/ctx/${{ matrix.name }}
          fi
          # IaC tracked source (the server expects IaC/ at the context root).
          cp -r templates/opensible-iac /tmp/ctx/IaC
          cp apps/server/Dockerfile /tmp/ctx/Dockerfile
          rm -f /tmp/ctx/.dockerignore

      - name: Console context (self-contained)
        if: matrix.name == 'console'
        run: |
          rm -rf /tmp/ctx
          mkdir -p /tmp/ctx
          cp -r apps/console/* /tmp/ctx/
          rm -rf /tmp/ctx/node_modules /tmp/ctx/dist

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable tags)
        uses: docker/build-push-action@v6
        with:
          context: /tmp/ctx
          file: /tmp/ctx/Dockerfile
          push: true
          tags: |
            ghcr.io/treon-studio/radas-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/treon-studio/radas-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GH_PACKAGES_TOKEN=${{ secrets.GH_PACKAGES_TOKEN }}
