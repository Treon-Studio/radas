name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test server
        working-directory: apps/opensible-server
        env:
          DATABASE_URL: postgresql://localhost/radas_test
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install -q -r requirements.txt
          .venv-ci/bin/python -m pytest tests/ -q 2>&1 | tail -3

      - name: Build console (API → prod domain)
        working-directory: apps/radas-console
        env:
          VITE_API_BASE: https://api-radas.treonstudio.com
        run: pnpm build

      - name: Deploy console → Cloudflare Pages
        working-directory: apps/radas-console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name radas-console

      - name: Deploy server+worker → VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/radas
            git pull origin main
            cd apps/opensible-server
            .venv/bin/pip install -q -r requirements.txt
            pm2 restart radas-server --update-env || true
            cd /opt/radas/apps/opensible-worker
            go mod tidy && go build -o /opt/radas/bin/radas-worker ./cmd/worker
            pm2 restart radas-worker --update-env || true
            cd /opt/radas
            grep -q 'PORT=5001' .env || echo 'PORT=5001' >> .env
            sleep 5
            curl -s -o /dev/null -w "health: %{http_code}\n" http://localhost:5001/api/health
