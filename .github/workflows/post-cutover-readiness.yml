name: Post-Cutover Readiness

on:
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run HTTP smoke against the protected staging origin
        required: false
        default: false
        type: boolean
      run_db_drill:
        description: Run the disposable PostgreSQL backup/restore drill
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  static-and-phoenix:
    name: Readiness scripts and Phoenix suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radas
          POSTGRES_PASSWORD: radas
          POSTGRES_DB: radas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radas -d radas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      TEST_DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      JWT_SECRET_KEY: readiness-test-jwt-secret
      INTERNAL_CALL_SECRET: readiness-test-internal-secret
      GLOBAL_SECRETS_ENCRYPTION_KEY: readiness-test-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - name: Install dependencies
        working-directory: apps/server
        run: mix deps.get
      - name: Validate scripts
        run: bash -n scripts/post-cutover-smoke.sh scripts/db-recovery-drill.sh
      - name: Run Phoenix suite
        working-directory: apps/server
        run: mix test

  live-staging:
    name: Protected staging HTTP smoke
    if: ${{ inputs.run_live_smoke }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Run post-cutover smoke
        env:
          RADAS_SMOKE_BASE_URL: ${{ secrets.RADAS_SMOKE_BASE_URL }}
          RADAS_SMOKE_ROUTER_URL: ${{ secrets.RADAS_SMOKE_ROUTER_URL }}
          RADAS_SMOKE_USERNAME: ${{ secrets.RADAS_SMOKE_USERNAME }}
          RADAS_SMOKE_PASSWORD: ${{ secrets.RADAS_SMOKE_PASSWORD }}
          RADAS_SMOKE_WORKER_NAME: ${{ secrets.RADAS_SMOKE_WORKER_NAME }}
          RADAS_SMOKE_WORKER_REGISTRATION_SECRET: ${{ secrets.RADAS_SMOKE_WORKER_REGISTRATION_SECRET }}
        run: |
          test -n "$RADAS_SMOKE_BASE_URL" || { echo 'RADAS_SMOKE_BASE_URL is required in staging'; exit 1; }
          test -n "$RADAS_SMOKE_WORKER_NAME" || { echo 'RADAS_SMOKE_WORKER_NAME is required in staging'; exit 1; }
          test -n "$RADAS_SMOKE_WORKER_REGISTRATION_SECRET" || { echo 'RADAS_SMOKE_WORKER_REGISTRATION_SECRET is required in staging'; exit 1; }
          bash scripts/post-cutover-smoke.sh
          worker_json="$(mktemp)"
          trap 'rm -f "$worker_json"' EXIT
          curl -sS --fail-with-body --connect-timeout 10 --max-time 20 \
            -H 'Content-Type: application/json' \
            -H "X-Worker-Registration-Secret: $RADAS_SMOKE_WORKER_REGISTRATION_SECRET" \
            --data "$(python3 -c 'import json,os; print(json.dumps({"name":os.environ["RADAS_SMOKE_WORKER_NAME"],"capabilities":{"smoke":True},"tags":["smoke"]}))')" \
            "$RADAS_SMOKE_BASE_URL/api/worker/register" -o "$worker_json"
          python3 - "$worker_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              body = json.load(fh)
          if body.get("success") is not True or not body.get("workerId") or not body.get("workerToken"):
              raise SystemExit("worker registration contract failed")
          print("PASS: worker registration")
          PY
          worker_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["workerId"])' "$worker_json")"
          worker_token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["workerToken"])' "$worker_json")"
          heartbeat_json="$(mktemp)"
          trap 'rm -f "$worker_json" "$heartbeat_json"' EXIT
          curl -sS --fail-with-body --connect-timeout 10 --max-time 20 \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $worker_token" \
            --data "$(python3 -c 'import json,sys; print(json.dumps({"workerId":sys.argv[1]}))' "$worker_id")" \
            "$RADAS_SMOKE_BASE_URL/api/worker/heartbeat" -o "$heartbeat_json"
          python3 - "$heartbeat_json" "$worker_id" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              body = json.load(fh)
          if body.get("success") is not True or body.get("workerId") != sys.argv[2]:
              raise SystemExit("worker heartbeat contract failed")
          print("PASS: worker heartbeat")
          PY
          # The identity is disposable; remove it from the staging registry.
          curl -sS --fail-with-body --connect-timeout 10 --max-time 20 \
            -X DELETE -H "Authorization: Bearer $worker_token" \
            "$RADAS_SMOKE_BASE_URL/api/admin/workers/$worker_id" -o /dev/null || true

  database-drill:
    name: Disposable PostgreSQL backup/restore drill
    if: ${{ inputs.run_db_drill }}
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: radas_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drill -d radas_drill"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DRILL_CONFIRM: '1'
      DRILL_DATABASE_URL: postgresql://drill:drill@localhost:5432/radas_drill
      DRILL_RESTORE_DATABASE_URL: postgresql://drill:drill@localhost:5432/radas_drill_restore
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - name: Install PostgreSQL client and Phoenix dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=drill createdb -h localhost -U drill radas_drill_restore || true
          cd apps/server && mix deps.get
      - name: Create schema and run migrations
        env:
          DATABASE_URL: ${{ env.DRILL_DATABASE_URL }}
        working-directory: apps/server
        run: mix ecto.migrate
      - name: Run recovery drill
        run: bash scripts/db-recovery-drill.sh
