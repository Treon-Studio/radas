name: RADAS CI

on:
  push:
    branches: [ develop, 'feat/*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build Web Console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> .npmrc
          pnpm install --frozen-lockfile

      - name: Typecheck Console
        working-directory: apps/console
        run: pnpm typecheck

      - name: Test Console
        working-directory: apps/console
        run: pnpm test

      - name: Build Console static bundle
        working-directory: apps/console
        run: pnpm build

  go-tests:
    name: Test Go CLI & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Test Go CLI
        working-directory: apps/cli
        run: go test ./...

      - name: Build Go CLI binary
        working-directory: apps/cli
        run: go build -o bin/radas .

      - name: Test Go Worker
        working-directory: apps/worker
        run: go test ./...

  elixir-tests:
    name: Test Phoenix Server API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radas
          POSTGRES_PASSWORD: radas
          POSTGRES_DB: radas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radas -d radas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      TEST_DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      JWT_SECRET_KEY: ci-test-secret-key-0123456789abcdef
      INTERNAL_CALL_SECRET: ci-test-internal-call-secret-key-0123456789
      GLOBAL_SECRETS_ENCRYPTION_KEY: ci-test-global-secrets-key-0123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Install dependencies + run Phoenix suite
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
          TEST_DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
          JWT_SECRET_KEY: ci-test-secret-key-0123456789abcdef
          INTERNAL_CALL_SECRET: ci-test-internal-call-secret-key-0123456789
          GLOBAL_SECRETS_ENCRYPTION_KEY: ci-test-global-secrets-key-0123456789
        run: |
          mix deps.get
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix test

      # Phase 8: the CLI route-parity gate runs inside the ExUnit suite
      # (RadasCliRouteParityTest); the sensitive-path static rules gate for
      # the Elixir tree is scripts/check-sensitive-paths.sh.
      - name: Check sensitive-path static rules (Elixir)
        run: bash scripts/check-sensitive-paths.sh

  # Task 6.2: cross-client contract parity gate. Runs the offline-safe mode
  # (a) of scripts/run-cross-client-contracts.sh: the Phoenix ExUnit suite is
  # the behavioral reference contract (including the ontology parity gate),
  # the console TypeScript client fixture leg (typecheck + vitest + build),
  # and the Go CLI (vet + tests) / worker tests. The live-server legs
  # (Go client + direct HTTP, TypeScript real HTTP) stay env-gated for
  # self-hosted/manual runs via RUN_FULL_CONTRACT=1 (mode b). A final step
  # runs the desktop pet's Node ontology alert tests, which no other job
  # covers.
  cross-client-contracts:
    name: Cross-Client Contract Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radas
          POSTGRES_PASSWORD: radas
          POSTGRES_DB: radas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radas -d radas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Install workspace dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> .npmrc
          pnpm install --frozen-lockfile

      - name: Run cross-client contract gate (mode a)
        env:
          DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
          TEST_DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
          JWT_SECRET_KEY: ci-test-secret-key-0123456789abcdef
          INTERNAL_CALL_SECRET: ci-test-internal-call-secret-key-0123456789
          GLOBAL_SECRETS_ENCRYPTION_KEY: ci-test-global-secrets-key-0123456789
        run: bash scripts/run-cross-client-contracts.sh

      # Domain ontology (contracts/domain-ontology.json): the desktop pet's
      # alert-DSL evaluator and alert-binding tests are plain Node and not
      # covered by the bash gate above, so run them here (no extra deps).
      - name: Desktop ontology tests (Node)
        working-directory: apps/desktop-app
        run: node --test ontology/*.test.js
