name: RADAS CI

on:
  push:
    branches: [ develop, 'feat/*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build Web Console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Console static bundle
        working-directory: apps/console
        run: pnpm build

  go-tests:
    name: Test Go CLI & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Test Go CLI
        working-directory: apps/cli
        run: go test ./...

      - name: Build Go CLI binary
        working-directory: apps/cli
        run: go build -o bin/radas .

      - name: Test Go Worker
        working-directory: apps/worker
        run: go test ./...

  python-tests:
    name: Test Flask Server API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radas
          POSTGRES_PASSWORD: radas
          POSTGRES_DB: radas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radas -d radas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      TEST_DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      JWT_SECRET_KEY: ci-test-secret-key-0123456789abcdef
      INTERNAL_CALL_SECRET: ci-test-internal-call-secret-key-0123456789
      GLOBAL_SECRETS_ENCRYPTION_KEY: ci-test-global-secrets-key-0123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: apps/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python API tests
        working-directory: apps/server
        run: pytest tests/

      # Task 6.1: contract surface checks alongside the API tests. The full
      # OpenAPI snapshot + PostgreSQL gate lives in api-contract.yml; these
      # steps keep parity/redaction visible on every plain server run.
      - name: Check CLI route parity (manifest vs served routes)
        working-directory: apps/server
        run: python scripts/check_route_parity.py

      - name: Check sensitive-path static rules
        working-directory: apps/server
        run: python scripts/check_sensitive_paths.py

  # Task 6.2: cross-client contract parity gate. Runs the offline-safe mode (a)
  # of scripts/run-cross-client-contracts.sh: the pytest server reference
  # contract, the console TypeScript client fixture leg (typecheck + vitest +
  # build), and the Go CLI (vet + tests) / worker tests. The live-server legs
  # (Go client + direct HTTP, TypeScript real HTTP) stay env-gated for
  # self-hosted/manual runs via RUN_FULL_CONTRACT=1 (mode b).
  cross-client-contracts:
    name: Cross-Client Contract Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radas
          POSTGRES_PASSWORD: radas
          POSTGRES_DB: radas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radas -d radas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create server virtualenv
        working-directory: apps/server
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Run cross-client contract gate (mode a)
        env:
          DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
          TEST_DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
          JWT_SECRET_KEY: ci-test-secret-key-0123456789abcdef
          INTERNAL_CALL_SECRET: ci-test-internal-call-secret-key-0123456789
          GLOBAL_SECRETS_ENCRYPTION_KEY: ci-test-global-secrets-key-0123456789
        run: bash scripts/run-cross-client-contracts.sh
