name: RADAS CI

on:
  push:
    branches: [ develop, 'feat/*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build Web Console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Console static bundle
        working-directory: apps/console
        run: pnpm build

  go-tests:
    name: Test Go CLI & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Test Go CLI
        working-directory: apps/cli
        run: go test ./...

      - name: Build Go CLI binary
        working-directory: apps/cli
        run: go build -o bin/radas .

      - name: Test Go Worker
        working-directory: apps/worker
        run: go test ./...

  python-tests:
    name: Test Flask Server API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: apps/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python API tests
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: ci-test-secret-key-0123456789abcdef
          INTERNAL_CALL_SECRET: ci-test-internal-call-secret-key-0123456789
          GLOBAL_SECRETS_ENCRYPTION_KEY: ci-test-global-secrets-key-0123456789
        run: pytest tests/

      # Task 6.1: contract surface checks alongside the API tests. The full
      # OpenAPI snapshot + PostgreSQL gate lives in api-contract.yml; these
      # steps keep parity/redaction visible on every plain server run.
      - name: Check CLI route parity (manifest vs served routes)
        working-directory: apps/server
        run: python scripts/check_route_parity.py

      - name: Check sensitive-path static rules
        working-directory: apps/server
        run: python scripts/check_sensitive_paths.py
