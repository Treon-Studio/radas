name: Phoenix API Contract

# Phase 8 cutover: the Flask server is retired. The behavioral contract gate
# is the Phoenix ExUnit suite — it asserts the platform envelope, error codes,
# redaction, worker protocol, and per-domain runtime bodies that the console,
# CLI, and Go worker depend on (mirror coverage of the retired Python suite).
# The CLI route-parity gate (contracts/cli-route-manifest.json vs served
# Phoenix routes) and the ontology parity gate run inside the same suite.

on:
  push:
    branches: [main]
    paths:
      - 'apps/server_elixir/**'
      - 'contracts/**'
      - '.github/workflows/api-contract.yml'
  pull_request:
    paths:
      - 'apps/server_elixir/**'
      - 'contracts/**'
      - '.github/workflows/api-contract.yml'

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: Phoenix contract suite (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radas
          POSTGRES_PASSWORD: radas
          POSTGRES_DB: radas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radas -d radas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      TEST_DATABASE_URL: postgresql://radas:radas@localhost:5432/radas_test
      JWT_SECRET_KEY: ci-test-secret-key-0123456789abcdef
      INTERNAL_CALL_SECRET: ci-test-internal-call-secret-key-0123456789
      GLOBAL_SECRETS_ENCRYPTION_KEY: ci-test-global-secrets-key-0123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Install dependencies
        working-directory: apps/server_elixir
        run: mix deps.get

      - name: Compile (warnings are non-fatal)
        working-directory: apps/server_elixir
        run: mix compile

      - name: Run full Phoenix suite against the PostgreSQL fixture
        working-directory: apps/server_elixir
        run: mix test

      - name: Check sensitive-path static rules (Elixir)
        run: bash scripts/check-sensitive-paths-elixir.sh
