# Production contract: copy .env.example to .env beside this file, generate and
# fill every required value, then run `docker compose up`. This file intentionally
# has no development secret defaults. For local development without containers,
# use the PM2 configuration in ecosystem.config.cjs with the same .env contract.
services:
  opensible-server:
    image: docker.io/ossopensible/opensible-server:latest
    container_name: opensible-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - opensible-data:/app/data
    environment:
      TZ: Asia/Phnom_Penh
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET must be set}
      GLOBAL_SECRETS_ENCRYPTION_KEY: ${GLOBAL_SECRETS_ENCRYPTION_KEY:?GLOBAL_SECRETS_ENCRYPTION_KEY must be set}
      WORKER_REGISTRATION_SECRET: ${WORKER_REGISTRATION_SECRET:?WORKER_REGISTRATION_SECRET must be set}
      VAULT_SERVER_SECRET: ${VAULT_SERVER_SECRET:?VAULT_SERVER_SECRET must be set}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://opensible.example.com}

  opensible-console:
    image: docker.io/ossopensible/opensible-console:latest
    container_name: opensible-console
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Phnom_Penh
      API_URL: ""
      BACKEND_HOST: opensible-server
      BACKEND_PORT: "5000"
    depends_on:
      - opensible-server

  opensible-worker:
    image: docker.io/ossopensible/opensible-worker:latest
    container_name: opensible-worker
    restart: unless-stopped
    network_mode: host
    volumes:
      - opensible-data:/app/data
      - ./ssh-keys:/root/.ssh:ro
    environment:
      TZ: Asia/Phnom_Penh
      WORKER_NAME: worker-go
      WORKER_TAGS: go
      WORKER_SERVER_URL: http://127.0.0.1:5000
      WORKER_TOKEN_FILE: /app/data/worker.token
      DATA_DIR: /app/data
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET must be set}
      GLOBAL_SECRETS_ENCRYPTION_KEY: ${GLOBAL_SECRETS_ENCRYPTION_KEY:?GLOBAL_SECRETS_ENCRYPTION_KEY must be set}
      WORKER_REGISTRATION_SECRET: ${WORKER_REGISTRATION_SECRET:?WORKER_REGISTRATION_SECRET must be set}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-3}
      VAULT_SERVER_HOST: 127.0.0.1
      VAULT_SERVER_PORT: 9998
      VAULT_SERVER_SECRET: ${VAULT_SERVER_SECRET:?VAULT_SERVER_SECRET must be set}
    depends_on:
      - opensible-server

volumes:
  opensible-data:
