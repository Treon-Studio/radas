<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180">
  <!-- Retro CRT Monitor Body Shadow -->
  <rect x="24" y="44" width="112" height="100" rx="8" fill="#1b2533" />
  <rect x="28" y="140" width="104" height="24" rx="4" fill="#141c26" />

  <!-- Retro Computer Body (Light Grey Bevel) -->
  <rect x="20" y="36" width="112" height="100" rx="8" fill="#d9dfeb" stroke="#1b2533" stroke-width="4" />
  <!-- Bevel Highlight -->
  <rect x="24" y="40" width="104" height="6" fill="#f0f4fa" />

  <!-- Monitor Screen Bezel (Dark Grey Border) -->
  <rect x="34" y="50" width="84" height="64" rx="4" fill="#303b4d" stroke="#1b2533" stroke-width="3" />

  <!-- Screen Glass (Cyan Retro Glowing Face) -->
  <rect x="38" y="54" width="76" height="56" rx="3" fill="#6ce0d8" />

  <!-- Screen Face Expression (Cute Happy Face: - ‿ -) -->
  <g fill="#1b2533">
    <!-- Left Eye -->
    <rect x="48" y="74" width="12" height="4" rx="2" />
    <!-- Right Eye -->
    <rect x="92" y="74" width="12" height="4" rx="2" />
    <!-- Smile Mouth -->
    <path d="M 68 84 Q 76 92 84 84" fill="none" stroke="#1b2533" stroke-width="4" stroke-linecap="round" />
    <!-- Cute Blush Pink Cheeks -->
    <ellipse cx="46" cy="84" rx="5" ry="3" fill="#ff85a1" opacity="0.8" />
    <ellipse cx="106" cy="84" rx="5" ry="3" fill="#ff85a1" opacity="0.8" />
  </g>

  <!-- Screen Glare Line -->
  <polygon points="42,58 64,58 48,106 42,106" fill="#ffffff" opacity="0.3" />

  <!-- Computer Base & Floppy Slot -->
  <rect x="24" y="132" width="104" height="24" rx="4" fill="#bac4d4" stroke="#1b2533" stroke-width="4" />
  <!-- Floppy Drive Slot -->
  <rect x="80" y="140" width="36" height="4" fill="#1b2533" />
  <rect x="120" y="140" width="4" height="4" fill="#4d8b55" /> <!-- Green Drive LED -->

  <!-- Pink Ribbon / Butterfly Bow on Top Left -->
  <g transform="translate(30, 26)">
    <!-- Butterfly Bow Left Wing -->
    <path d="M 0 10 C -12 0 -12 20 0 10 Z" fill="#ff5c8d" stroke="#1b2533" stroke-width="2" />
    <!-- Butterfly Bow Right Wing -->
    <path d="M 0 10 C 12 0 12 20 0 10 Z" fill="#ff5c8d" stroke="#1b2533" stroke-width="2" />
    <!-- Bow Knot -->
    <circle cx="0" cy="10" r="4" fill="#ffe066" stroke="#1b2533" stroke-width="2" />
  </g>
</svg>
