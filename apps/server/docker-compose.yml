# Production contract (Phase 8 cutover): copy .env.example to .env beside this
# file, generate and fill every required value, then run
# `docker compose --profile server up`.
#
# Phoenix (Elixir) is the API backend. The legacy Flask container
# (opensible-server) has been retired — it is no longer part of the default
# or router topologies. For local development without containers, use the
# PM2 configuration in ecosystem.config.cjs with the same .env contract.
services:
  opensible-phoenix:
    image: docker.io/ossopensible/opensible-phoenix:latest
    container_name: opensible-phoenix
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - opensible-data:/app/data
    environment:
      TZ: Asia/Phnom_Penh
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET must be set}
      GLOBAL_SECRETS_ENCRYPTION_KEY: ${GLOBAL_SECRETS_ENCRYPTION_KEY:?GLOBAL_SECRETS_ENCRYPTION_KEY must be set}
      WORKER_REGISTRATION_SECRET: ${WORKER_REGISTRATION_SECRET:?WORKER_REGISTRATION_SECRET must be set}
      VAULT_SERVER_SECRET: ${VAULT_SERVER_SECRET:?VAULT_SERVER_SECRET must be set}
      PREVIEW_WEBHOOK_SECRET: ${PREVIEW_WEBHOOK_SECRET:?PREVIEW_WEBHOOK_SECRET must be set}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://opensible.example.com}

  opensible-console:
    image: docker.io/ossopensible/opensible-console:latest
    container_name: opensible-console
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Phnom_Penh
      API_URL: ""
      BACKEND_HOST: opensible-phoenix
      BACKEND_PORT: "4000"
    depends_on:
      - opensible-phoenix

  opensible-worker:
    image: docker.io/ossopensible/opensible-worker:latest
    container_name: opensible-worker
    restart: unless-stopped
    network_mode: host
    volumes:
      - opensible-data:/app/data
      - ./ssh-keys:/root/.ssh:ro
    environment:
      TZ: Asia/Phnom_Penh
      WORKER_NAME: worker-go
      WORKER_TAGS: go
      WORKER_SERVER_URL: http://127.0.0.1:4000
      WORKER_TOKEN_FILE: /app/data/worker.token
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET must be set}
      GLOBAL_SECRETS_ENCRYPTION_KEY: ${GLOBAL_SECRETS_ENCRYPTION_KEY:?GLOBAL_SECRETS_ENCRYPTION_KEY must be set}
      WORKER_REGISTRATION_SECRET: ${WORKER_REGISTRATION_SECRET:?WORKER_REGISTRATION_SECRET must be set}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-3}
      VAULT_SERVER_HOST: 127.0.0.1
      VAULT_SERVER_PORT: 9998
      VAULT_SERVER_SECRET: ${VAULT_SERVER_SECRET:?VAULT_SERVER_SECRET must be set}
    depends_on:
      - opensible-phoenix

  # Front-door router (single origin for the console). The router profile
  # keeps the direct-ports topology working without nginx.
  opensible-router:
    image: nginx:1.27-alpine
    container_name: opensible-router
    restart: unless-stopped
    profiles: ["router"]
    ports:
      - "8090:80"
    volumes:
      - ../../nginx/radas-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - opensible-phoenix

volumes:
  opensible-data:
